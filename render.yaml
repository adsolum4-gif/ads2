# Static site (recommended). Do NOT use `npm run dev` as start command on Render.
services:
  - type: web
    name: ads2
    runtime: static
    buildCommand: npm install && npm --prefix admin install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
      - type: rewrite
        source: /*
        destination: /index.html
